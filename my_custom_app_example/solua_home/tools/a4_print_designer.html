<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solua Home · A4 单据本地设计器</title>
<style>
:root{font:14px/1.45 system-ui,"Microsoft YaHei",sans-serif;color:#202a32;background:#eef1f3}*{box-sizing:border-box}body{margin:0}.app{display:grid;grid-template-columns:minmax(270px,330px) 1fr;min-height:100vh}.controls{padding:20px;background:#fff;border-right:1px solid #cbd2d8;overflow:auto}.controls h1{font-size:19px;margin:0 0 4px}.hint{color:#4d5b64;margin:0 0 16px}.group{border-top:1px solid #d8dee2;padding:12px 0}.group h2{font-size:14px;margin:0 0 8px}.field{display:grid;grid-template-columns:1fr 115px;align-items:center;gap:10px;margin:8px 0}.field input[type=range]{width:100%}.field input[type=color]{width:52px;height:30px}.checks{display:grid;grid-template-columns:1fr 1fr;gap:6px}.checks label{display:flex;align-items:center;gap:6px}.actions{display:grid;gap:8px}button,select{font:inherit;min-height:36px;padding:6px 9px;border:1px solid #9aa8b1;border-radius:4px;background:#fff;color:#17212a}button{cursor:pointer}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #306ca0;outline-offset:2px}.primary{background:#263842;color:#fff;border-color:#263842}.status{font-size:12px;color:#33444d;min-height:34px}.stage{overflow:auto;padding:24px;display:flex;justify-content:center;align-items:flex-start}.paper{width:210mm;min-width:210mm;min-height:297mm;padding:var(--page-margin,12mm);background:white;box-shadow:0 2px 15px #24313b33;color:#25313a;font-size:var(--font-size,9pt);overflow-wrap:anywhere}.paper h1{margin:0 0 3mm;text-align:center;font-size:var(--title-size,18pt);color:var(--title-color,#99732c);line-height:1.2}.subtitle{text-align:center;color:#52616a;margin-bottom:4mm}.docmeta{width:100%;border-collapse:collapse;margin:0 0 3mm;table-layout:fixed}.docmeta td{width:50%;padding:var(--cell-padding,1.5mm);vertical-align:top;border:1px solid #d6dade}.warning{padding:2mm;margin:2mm 0;background:#fff3dc;color:#714600;border:1px solid #d4ac62}.items{width:100%;table-layout:fixed;border-collapse:collapse;font-size:inherit;line-height:var(--body-line-height,1.35)}.items th,.items td{padding:var(--cell-padding,1.5mm);border:1px solid #aeb8be;vertical-align:top;overflow-wrap:anywhere;word-break:normal}.items th{background:var(--head-bg,#f5f1e9);color:#202a32;text-align:left;font-size:var(--head-size,9pt)}.items thead{display:table-header-group}.items tr{break-inside:avoid}.items .number{text-align:right;white-space:normal}.items img,.mock-thumb{display:block;width:min(12mm,100%);aspect-ratio:1;object-fit:cover;margin:auto}.mock-thumb{background:linear-gradient(135deg,#e8ecef,#aeb7bd);border:1px solid #c5ccd0;border-radius:1mm;box-shadow:0 1mm 2mm #25313a40}.total{margin-top:3mm;text-align:right;font-size:11pt;font-weight:700}.block{margin-top:4mm;padding:2mm;border:1px solid #d6dade;break-inside:avoid}.signature{min-height:27mm;margin-top:3mm;padding:2mm;border:1px solid #929da4}.footer{margin-top:4mm;text-align:center;color:#56636b;font-size:8pt}.overflow-ok{color:#176b38}.overflow-bad{color:#a12525}.selftest{color:#33444d;font-size:12px}.width-editor{display:grid;grid-template-columns:1fr 82px;gap:6px 10px;align-items:center}.width-editor label{overflow-wrap:anywhere}.width-editor input{width:82px}.width-actions{display:flex;gap:8px;margin-top:8px}.width-actions button{flex:1;font-size:12px}@media(max-width:900px){.app{grid-template-columns:1fr}.controls{border-right:0;border-bottom:1px solid #cbd2d8}.stage{justify-content:flex-start;padding:14px}}@media print{@page{size:A4;margin:0}html,body{margin:0;background:white}.app{display:block;min-height:0}.controls{display:none}.stage{display:block;overflow:visible;padding:0}.paper{width:210mm;min-width:0;min-height:297mm;padding:var(--page-margin,12mm);box-shadow:none;margin:0}.items{page-break-inside:auto}.items tr{break-inside:avoid}.docmeta,.block,.signature{break-inside:avoid}}
</style>
</head>
<body>
<div class="app">
<aside class="controls" aria-label="单据设计设置">
  <h1>Solua Home · A4 设计器</h1><p class="hint">商品主数据：生产快照 2026-09-24；单号与数量仅用于排版。</p>
  <div class="group"><label class="field" for="doctype"><span>单据类型</span><select id="doctype"><option value="Sales Order">销售订单 / Sales Order</option><option value="Sales Invoice">销售发票 / Sales Invoice</option><option value="Delivery Note">送货单 / Delivery Note</option><option value="Pick List">拣货单 / Pick List</option></select></label></div>
  <div class="group"><h2>版式</h2>
    <label class="field" for="fontSize"><span>字号</span><input id="fontSize" type="range" min="7" max="13" value="9"><output id="fontSizeOut">9 pt</output></label>
    <label class="field" for="titleSize"><span>标题字号</span><input id="titleSize" type="range" min="12" max="26" value="18"><output id="titleSizeOut">18 pt</output></label>
    <label class="field" for="headSize"><span>表头字号</span><input id="headSize" type="range" min="6" max="14" value="9"><output id="headSizeOut">9 pt</output></label>
    <label class="field" for="bodyLineHeight"><span>正文行高</span><input id="bodyLineHeight" type="range" min="1" max="2" step="0.05" value="1.35"><output id="lineHeightOut">1.35</output></label>
    <label class="field" for="cellPadding"><span>单元格内边距</span><input id="cellPadding" type="range" min="0.5" max="3" step="0.5" value="1.5"><output id="paddingOut">1.5 mm</output></label>
    <label class="field" for="pageMargin"><span>页面内边距</span><input id="pageMargin" type="range" min="5" max="20" value="12"><output id="marginOut">12 mm</output></label>
    <label class="field" for="titleColor"><span>标题颜色</span><input id="titleColor" type="color" value="#99732c"></label>
    <label class="field" for="headBg"><span>表头底色</span><input id="headBg" type="color" value="#f5f1e9"></label>
  </div>
  <div class="group"><h2>标题列（每列独立开关）</h2><div class="checks" id="columnControls"></div></div>
  <div class="group"><h2>列宽（合计 100%）</h2><div id="widthControls" class="width-editor"></div><div class="width-actions"><button id="equalWidthsBtn" type="button">均分可见列</button><button id="resetWidthsBtn" type="button">恢复本单据默认列宽</button></div></div>
  <div class="group actions"><button class="primary" id="printBtn">打印 / 导出 PDF</button><button id="copyBtn">复制当前 CSS</button><button id="resetBtn">恢复默认</button>
    <div id="overflowStatus" class="status" role="status" aria-live="polite"></div><div id="selftestStatus" class="selftest" role="status" aria-live="polite"></div>
  </div>
</aside>
<main class="stage" aria-label="A4 打印预览"><article id="paper" class="paper"></article></main>
</div>
<script>
(() => {
  const samples = [
    {image:'▧',name:'光感绒-10',spu:'B-DR',sku:'SH151060-10',cor:'20',barcode:'2026061151060',description:'生产商品主数据快照；长描述用于验证 A4 自动换行与列宽。',qty:'12',picked:'12',uom:'条',rate:'460',amount:'5 520',ordered:'20 / 8',remaining:'12 / 8',trace:'—',warehouse:'Receiving - SH',order:'SO-PREVIEW'},
    {image:'▧',name:'光感绒-09',spu:'B-DR',sku:'SH151060-09',cor:'16',barcode:'2026061151060',description:'生产商品主数据快照',qty:'8',picked:'8',uom:'条',rate:'460',amount:'3 680',ordered:'8 / 0',remaining:'8 / 0',trace:'—',warehouse:'Receiving - SH',order:'SO-PREVIEW'},
    {image:'▧',name:'光感绒-08',spu:'B-DR',sku:'SH151060-08',cor:'15',barcode:'2026061151060',description:'生产商品主数据快照',qty:'6',picked:'6',uom:'条',rate:'460',amount:'2 760',ordered:'6 / 0',remaining:'6 / 0',trace:'—',warehouse:'Receiving - SH',order:'SO-PREVIEW'},
    {image:'▧',name:'光感绒-07',spu:'B-DR',sku:'SH151060-07',cor:'14',barcode:'2026061151060',description:'生产商品主数据快照',qty:'4',picked:'4',uom:'条',rate:'460',amount:'1 840',ordered:'4 / 0',remaining:'4 / 0',trace:'—',warehouse:'Receiving - SH',order:'SO-PREVIEW'}
  ];
  const docs = {
    'Sales Order':{title:'Confirmação de Encomenda / 订单确认单',caption:'订购 / Encomenda',columns:['qty','uom','rate','amount'],totalLabel:'含税合计 / Total',extra:'付款安排 / Plano de pagamento: 30% depósito · saldo antes da entrega / 定金 30%，交付前付清余款。<br>开票安排 / Plano de faturação: emitir após confirmação / 确认后开票。'},
    'Sales Invoice':{title:'Venda por atacado / 批发销售单',caption:'销售 / Venda',columns:['qty','uom','rate','amount'],totalLabel:'合计 / Total',extra:'客户 / Cliente: Loja Solua · NUIT: 400123456<br>付款方式 / Pagamento: Transferência bancária'},
    'Delivery Note':{title:'Guia de Remessa / 送货单',caption:'本次送货 / Entrega',columns:['ordered','remaining','uom','rate','amount','trace'],totalLabel:'总数量 / Total Qty',extra:'运输 / Transporte: Maputo · Motorista: António · 84-123-456<br>包装 / Embalagem: 4 caixas · 1 palete<br>发票安排 / Faturação: Entregar após conferência.'},
    'Pick List':{title:'Lista de Separação / 拣货单',caption:'仓库拣货 / Separação',columns:['qty','picked','uom','warehouse','order'],totalLabel:'总拣货数量 / Total Qty',extra:'仓库 / Armazém: Receiving - SH · Zona: A2-B4<br>拣货员 / Separado por: __________________ · 日期 / Data: ________________'}
  };
  const baseColumns=['image','name','spu','sku','cor','barcode','description'];
  const columnDefs=[['image','FOTO'],['name','Artigo / 商品'],['spu','SPU / SPU编码'],['sku','SKU / 货号'],['cor','COR'],['barcode','EAN / 条码'],['description','Descrição / 描述'],['ordered','Qtd. / Anterior<br>订购 / 此前已交付'],['remaining','Qtd. / Falta<br>本次 / 剩余'],['qty','Qt'],['picked','Separado / 已拣'],['uom','Un.'],['rate','Prc'],['amount','Valor / 金额'],['trace','Rastreabilidade / 追溯'],['warehouse','Armazém / 仓库'],['order','S.O. / 订单']];
  const paper=document.getElementById('paper'),type=document.getElementById('doctype'),settings={fontSize:document.getElementById('fontSize'),titleSize:document.getElementById('titleSize'),headSize:document.getElementById('headSize'),bodyLineHeight:document.getElementById('bodyLineHeight'),cellPadding:document.getElementById('cellPadding'),pageMargin:document.getElementById('pageMargin'),titleColor:document.getElementById('titleColor'),headBg:document.getElementById('headBg')};
  const defaultWidths={'Sales Order':{image:7,name:13,spu:8,sku:13,cor:8,barcode:12,description:18,qty:8,uom:6,rate:7,amount:8},'Sales Invoice':{image:7,name:13,spu:8,sku:13,cor:8,barcode:12,description:18,qty:8,uom:6,rate:7,amount:8},'Delivery Note':{image:6,name:10,spu:8,sku:10,cor:6,barcode:8,description:11,ordered:10,remaining:10,qty:10,uom:5,rate:5,amount:6,trace:5},'Pick List':{image:8,name:14,spu:8,sku:13,cor:8,barcode:12,description:17,qty:8,picked:8,uom:5,warehouse:8,order:7}};
  const widths=Object.fromEntries(Object.entries(defaultWidths).map(([key,value])=>[key,{...value}]));
  const visible=Object.fromEntries(Object.entries(docs).map(([doc,value])=>[doc,Object.fromEntries([...baseColumns,...value.columns].map(key=>[key,key!=='image']))]));
  const columnToggles=()=>[...document.querySelectorAll('#columnControls input[data-col]')];
  const availableColumns=()=>columnDefs.filter(([key])=>baseColumns.includes(key)||docs[type.value].columns.includes(key));
  const activeColumns=()=>{const available=new Set(availableColumns().map(([key])=>key)),singleQty=type.value==='Delivery Note'&&!visible['Delivery Note'].ordered&&!visible['Delivery Note'].remaining;return columnDefs.filter(([key])=>(available.has(key)&&visible[type.value][key])||(singleQty&&key==='qty'));};
  function drawColumnControls(){const host=document.getElementById('columnControls');host.innerHTML=availableColumns().map(([key,label])=>`<label><input type="checkbox" data-col="${key}" ${visible[type.value][key]?'checked':''}>${label.replace(/<br\s*\/?>/gi,' / ').replace(/<[^>]*>/g,'')}</label>`).join('');columnToggles().forEach(input=>input.addEventListener('change',()=>{visible[type.value][input.dataset.col]=input.checked;render();}));}
  const normalizeWidths=(keys,source)=>{const values=keys.map(key=>Math.max(0.1,Number(source[key])||defaultWidths[type.value][key]||1)),sum=values.reduce((a,b)=>a+b,0);return Object.fromEntries(keys.map((key,i)=>[key,values[i]*100/sum]));};
  function setColumnWidth(keys,key,requested){const minimum=2,maximum=Math.min(90,100-minimum*(keys.length-1)),value=Math.max(minimum,Math.min(maximum,requested)),others=keys.filter(item=>item!==key),otherTotal=others.reduce((sum,item)=>sum+widths[type.value][item],0),remaining=100-value;widths[type.value][key]=value;others.forEach(item=>widths[type.value][item]=otherTotal?widths[type.value][item]*remaining/otherTotal:remaining/others.length);}
  function drawWidthControls(cols,current){const host=document.getElementById('widthControls');host.innerHTML=cols.map(([key,label])=>{const text=label.replace(/<br\s*\/?>/gi,' / ').replace(/<[^>]*>/g,'');return `<label for="width-${key}">${text}</label><input id="width-${key}" type="number" min="2" max="90" step="0.1" inputmode="decimal" aria-label="${safe(text)}列宽百分比" value="${current[key].toFixed(1)}">`;}).join('');host.querySelectorAll('input').forEach(input=>input.addEventListener('change',()=>{const key=input.id.slice(6),value=Number(input.value);if(!Number.isFinite(value)||value<=0){input.value=widths[type.value][key].toFixed(1);return;}setColumnWidth(cols.map(([col])=>col),key,value);render();}));}
  const safe=(s)=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function render(){const doc=docs[type.value],cols=activeColumns(),isDelivery=type.value==='Delivery Note',isPick=type.value==='Pick List';Object.assign(widths[type.value],normalizeWidths(cols.map(([key])=>key),widths[type.value]));paper.style.setProperty('--font-size',settings.fontSize.value+'pt');paper.style.setProperty('--title-size',settings.titleSize.value+'pt');paper.style.setProperty('--head-size',settings.headSize.value+'pt');paper.style.setProperty('--body-line-height',settings.bodyLineHeight.value);paper.style.setProperty('--cell-padding',settings.cellPadding.value+'mm');paper.style.setProperty('--page-margin',settings.pageMargin.value+'mm');paper.style.setProperty('--title-color',settings.titleColor.value);paper.style.setProperty('--head-bg',settings.headBg.value);document.getElementById('fontSizeOut').value=settings.fontSize.value+' pt';document.getElementById('titleSizeOut').value=settings.titleSize.value+' pt';document.getElementById('headSizeOut').value=settings.headSize.value+' pt';document.getElementById('lineHeightOut').value=Number(settings.bodyLineHeight.value).toFixed(2).replace(/0$/,'');document.getElementById('paddingOut').value=settings.cellPadding.value+' mm';document.getElementById('marginOut').value=settings.pageMargin.value+' mm';drawWidthControls(cols,widths[type.value]);
    const headers=cols.map(([,label])=>`<th scope="col">${label}</th>`).join('');
    const rows=samples.map(row=>`<tr>${cols.map(([key])=>`<td>${key==='image'?'<span class="mock-thumb" role="img" aria-label="模拟商品缩略图"></span>':safe(row[key]||'—')}</td>`).join('')}</tr>`).join('');
    const colgroup=`<colgroup>${cols.map(([key])=>`<col data-col="${key}" style="width:${widths[type.value][key].toFixed(3)}%">`).join('')}</colgroup>`;
    paper.innerHTML=`<h1>${doc.title}</h1><div class="subtitle">Solua Home · ${doc.caption}</div>${type.value==='Sales Order'?'<div class="warning">RASCUNHO / 草稿 — Documento não oficial / 非正式凭证</div>':''}<table class="docmeta"><tbody><tr><td><b>Cliente / 客户：</b>Loja Solua Home<br>NUIT: 400123456<br>Maputo, Moçambique</td><td><b>N.º / 单号：</b>${isDelivery?'DN-PREVIEW':isPick?'PICK-PREVIEW':type.value==='Sales Invoice'?'SINV-PREVIEW':'SO-PREVIEW'}<br><b>Data / 日期：</b>24-09-2026</td></tr></tbody></table><table class="items">${colgroup}<thead><tr><th colspan="${cols.length}">${doc.caption}</th></tr><tr>${headers}</tr></thead><tbody>${rows}</tbody></table><div class="total">${doc.totalLabel}: ${isDelivery||isPick?'30':'13 800'} ${isDelivery||isPick?'un.':'MZN'}</div><div class="block">${doc.extra}</div>${isDelivery?'<div class="block">差异 / 退货备注 / Diferenças / devoluções: __________________________________________</div><div class="signature">客户签收 / Recebido por: ____________________　签字 / Assinatura: ____________________<br><br>日期 / Data: ____________________　司机确认 / Motorista: ____________________</div>':isPick?'<div class="signature">拣货完成 / Separação concluída: ____________________　复核 / Conferido: ____________________</div>':''}<div class="footer">${type.value} · Página 1 / 1</div>`;
    requestAnimationFrame(checkOverflow);
  }
  function checkOverflow(){const wide=[...paper.querySelectorAll('table')].some(t=>t.scrollWidth>t.clientWidth+1);const status=document.getElementById('overflowStatus');status.textContent=wide?'⚠ 表格发生横向溢出，请减少字号/间距或隐藏列。':'✓ A4 宽度正常，无横向溢出';status.className='status '+(wide?'overflow-bad':'overflow-ok');return !wide;}
  Object.values(settings).forEach(x=>x.addEventListener('input',render));type.addEventListener('change',()=>{drawColumnControls();render();});
  document.getElementById('printBtn').addEventListener('click',()=>window.print());
  document.getElementById('equalWidthsBtn').addEventListener('click',()=>{const cols=activeColumns().map(([key])=>key);Object.assign(widths[type.value],Object.fromEntries(cols.map(key=>[key,100/cols.length])));render();});
  document.getElementById('resetWidthsBtn').addEventListener('click',()=>{widths[type.value]={...defaultWidths[type.value]};render();});
  document.getElementById('resetBtn').addEventListener('click',()=>{type.value='Sales Order';settings.fontSize.value=9;settings.titleSize.value=18;settings.headSize.value=9;settings.bodyLineHeight.value=1.35;settings.cellPadding.value=1.5;settings.pageMargin.value=12;settings.titleColor.value='#99732c';settings.headBg.value='#f5f1e9';Object.keys(defaultWidths).forEach(key=>{widths[key]={...defaultWidths[key]};Object.keys(visible[key]).forEach(col=>visible[key][col]=col!=='image');});drawColumnControls();render();});
  const cssForCopy=()=>`@page{size:A4;margin:0}\n.paper{width:210mm;min-height:297mm;padding:${settings.pageMargin.value}mm;box-sizing:border-box;color:#25313a;font-size:${settings.fontSize.value}pt;overflow-wrap:anywhere}\n.paper h1{font-size:${settings.titleSize.value}pt;color:${settings.titleColor.value}}\n.items{width:100%;table-layout:fixed;border-collapse:collapse;font-size:${settings.fontSize.value}pt;line-height:${settings.bodyLineHeight.value}}\n${activeColumns().map(([key])=>`.items col[data-col="${key}"]{width:${widths[type.value][key].toFixed(3)}%}`).join('\n')}\n.items th{font-size:${settings.headSize.value}pt;background:${settings.headBg.value}}\n.items th,.items td{padding:${settings.cellPadding.value}mm;border:1px solid #aeb8be;vertical-align:top;overflow-wrap:anywhere}\n.items thead{display:table-header-group}\n.items tr{break-inside:avoid}\n`;
  document.getElementById('copyBtn').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(cssForCopy());document.getElementById('overflowStatus').textContent='已复制当前预览 CSS。';}catch{document.getElementById('overflowStatus').textContent='浏览器未授予剪贴板权限；请在安全上下文打开后复制。';}});
  function selfCheck(){const originalType=type.value,originalVisible=JSON.parse(JSON.stringify(visible)),originalWidths=Object.fromEntries(Object.entries(widths).map(([key,value])=>[key,{...value}])),checks=[];for(const key of Object.keys(docs)){type.value=key;drawColumnControls();render();const cols=activeColumns(),sum=[...paper.querySelectorAll('.items colgroup col')].reduce((n,col)=>n+parseFloat(col.style.width),0);checks.push(paper.querySelectorAll('.items tbody tr').length===samples.length&&paper.querySelectorAll('.items thead tr:nth-child(2) th').length===cols.length);checks.push(Math.abs(sum-100)<0.02);checks.push(columnToggles().length===availableColumns().length);checks.push(columnToggles().some(input=>input.dataset.col==='spu'));checks.push(paper.querySelector('.items tbody').textContent.includes('B-DR'));checks.push(!paper.querySelector('.items tbody').textContent.includes('MZN'));checks.push(checkOverflow());if(key==='Sales Order'||key==='Sales Invoice')checks.push(paper.querySelector('.total').textContent.includes('MZN'));if(key==='Delivery Note')checks.push(columnToggles().some(input=>input.dataset.col==='trace'));}type.value='Delivery Note';visible['Delivery Note'].ordered=false;visible['Delivery Note'].remaining=false;drawColumnControls();render();checks.push(activeColumns().some(([key])=>key==='qty'));checks.push([...paper.querySelectorAll('.items thead tr:nth-child(2) th')].some(th=>th.textContent==='Qt'));checks.push(paper.querySelector('.items tbody tr td:nth-child('+ (activeColumns().findIndex(([key])=>key==='qty')+1) +')').textContent==='12');type.value='Sales Order';drawColumnControls();const sku=document.querySelector('#columnControls input[data-col="sku"]');sku.checked=false;sku.dispatchEvent(new Event('change'));checks.push(![...paper.querySelectorAll('.items thead th,.items tbody td')].some(c=>c.textContent.includes('SKU / 货号')||c.textContent.includes('SH151060-10')));checks.push(Math.abs([...paper.querySelectorAll('.items colgroup col')].reduce((sum,col)=>sum+parseFloat(col.style.width),0)-100)<0.02);Object.keys(visible).forEach(key=>visible[key]={...originalVisible[key]});Object.keys(widths).forEach(key=>widths[key]=originalWidths[key]);type.value=originalType;drawColumnControls();render();const ok=checks.every(Boolean);document.getElementById('selftestStatus').textContent=`${ok?'✓':'✗'} 内置检查：单据切换、独立列开关、全单据 custom_spu_code、送货数量回退、追溯、列宽归一、商品行币种、总价、A4 溢出（${checks.filter(Boolean).length}/${checks.length}）`;document.getElementById('selftestStatus').className='selftest '+(ok?'overflow-ok':'overflow-bad');return ok;}
  drawColumnControls();render();selfCheck();
})();
</script>
</body>
</html>
