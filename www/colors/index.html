{% extends "templates/web.html" %}

{% block page_content %}
<style>
    .navbar, .web-footer { display: none !important; }
    body { background: #fbf8f2; }
    .color-card-page { max-width: 1120px; margin: 0 auto; padding: 28px 22px 72px; color: #181410; }
    .color-card-brand { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 50px; padding-bottom: 18px; border-bottom: 1px solid #d8c7a4; }
    .color-card-brand img { width: 150px; height: 44px; object-fit: cover; object-position: center; }
    .color-card-brand a { color: #6d552d; font-size: 13px; text-decoration: none; }
    .color-card-page h1 { margin: 0; font-family: Georgia, 'Times New Roman', serif; font-size: clamp(38px, 6vw, 68px); font-weight: 400; letter-spacing: -2px; }
    .color-card-intro { max-width: 620px; margin: 14px 0 26px; color: #665d50; font-size: 15px; line-height: 1.8; }
    .color-card-search { display: flex; gap: 10px; max-width: 680px; margin: 0 0 34px; }
    .color-card-search input { flex: 1; min-width: 0; height: 48px; border: 1px solid #cdbb96; border-radius: 0; background: #fffdf8; color: #181410; padding: 0 14px; }
    .color-card-search .btn { height: 48px; border: 0; border-radius: 0; background: #181410; color: #fffdf8; padding: 0 24px; }
    .color-card-result { display: none; }
    .color-card-header { display: flex; gap: 26px; align-items: flex-start; margin-bottom: 30px; padding: 22px; background: #f0e8d8; }
    .color-card-header img { width: 190px; height: 190px; object-fit: contain; background: #0d0c0a; border: 1px solid #c8a767; }
    .color-card-header h2 { margin: 4px 0 14px; font-family: Georgia, 'Times New Roman', serif; font-size: 32px; font-weight: 400; }
    .color-card-meta { color: #665d50; margin: 7px 0; }
    .color-card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 18px; }
    .color-card-item { border: 1px solid #d8c7a4; overflow: hidden; background: #fffdf8; }
    .color-card-item img { display: block; width: 100%; height: 190px; object-fit: contain; background: #0d0c0a; cursor: zoom-in; }
    .color-card-item-body { padding: 14px; }
    .color-card-code { color: #181410; font-weight: 600; word-break: break-word; }
    .color-card-muted { color: #756b5b; font-size: 13px; }
    .color-card-empty { padding: 24px; border: 1px dashed #cdbb96; color: #756b5b; }
    .color-card-footer { margin-top: 56px; padding-top: 18px; border-top: 1px solid #d8c7a4; color: #756b5b; font-size: 12px; }
    @media (max-width: 560px) {
        .color-card-brand { margin-bottom: 34px; }
        .color-card-brand img { width: 126px; height: 38px; }
        .color-card-header { flex-direction: column; }
        .color-card-header img { width: 100%; height: 240px; }
        .color-card-search { flex-direction: column; }
        .color-card-search .btn { width: 100%; }
    }
</style>

<div class="color-card-page">
    <div class="color-card-brand"><a href="/"><img src="/files/solua-logo.jpg" alt="SOLUA HOME"></a><a href="/">Voltar à SOLUA HOME ↗</a></div>
    <h1>Cartela de cores</h1>
    <p class="color-card-intro">Pesquisa por referência, código completo ou código de barras para consultar as cores publicadas.</p>
    <form class="color-card-search" id="color-card-search">
        <input id="color-card-query" class="form-control" type="search"
               placeholder="Ex.: SH151015 ou SH151015-01" autocomplete="off">
        <button class="btn" type="submit">Pesquisar</button>
    </form>
    <div id="color-card-status" class="color-card-muted" role="status"></div>
    <div id="color-card-result" class="color-card-result"></div>
    <div class="color-card-footer">© 2026 SOLUA HOME · A tua luz. A tua escolha.</div>
</div>
{% endblock %}

{% block script %}
<script>
frappe.ready(() => {
    document.documentElement.lang = "pt";
    const form = document.getElementById("color-card-search");
    const input = document.getElementById("color-card-query");
    const status = document.getElementById("color-card-status");
    const result = document.getElementById("color-card-result");

    const text = (tag, value, className) => {
        const node = document.createElement(tag);
        node.textContent = value || "";
        if (className) node.className = className;
        return node;
    };

    const image = (src, alt, className) => {
        if (!src) return null;
        const node = document.createElement("img");
        node.src = src;
        node.alt = alt || "";
        node.loading = "lazy";
        if (className) node.className = className;
        node.addEventListener("click", () => window.open(src, "_blank", "noopener"));
        return node;
    };

    const render = (card) => {
        result.replaceChildren();
        result.style.display = "block";

        const header = document.createElement("div");
        header.className = "color-card-header";
        const cover = image(card.image, card.name, "");
        if (cover) header.appendChild(cover);
        const meta = document.createElement("div");
        meta.appendChild(text("h2", card.name));
        meta.appendChild(text("p", `Referência: ${card.order_code || card.template_code}`, "color-card-meta"));
        if (card.spu_code) meta.appendChild(text("p", `SPU: ${card.spu_code}`, "color-card-meta"));
        if (card.spec_summary) meta.appendChild(text("p", card.spec_summary, "color-card-meta"));
        header.appendChild(meta);
        result.appendChild(header);

        const grid = document.createElement("div");
        grid.className = "color-card-grid";
        (card.variants || []).forEach((variant) => {
            const item = document.createElement("article");
            item.className = "color-card-item";
            const photo = image(variant.image, variant.color_name || variant.order_code, "");
            if (photo) item.appendChild(photo);
            else item.appendChild(text("div", "Imagem em preparação", "color-card-empty"));
            const body = document.createElement("div");
            body.className = "color-card-item-body";
            body.appendChild(text("div", variant.order_code, "color-card-code"));
            if (variant.color_code) body.appendChild(text("div", `Código de cor: ${variant.color_code}`, "color-card-muted"));
            if (variant.color_name) body.appendChild(text("div", variant.color_name, "color-card-muted"));
            item.appendChild(body);
            grid.appendChild(item);
        });
        if (!grid.children.length) grid.appendChild(text("div", "Ainda não existem cores publicadas.", "color-card-empty"));
        result.appendChild(grid);
    };

    const search = async (query) => {
        query = (query || "").trim();
        if (!query) return;
        status.textContent = "A pesquisar…";
        result.style.display = "none";
        try {
            const response = await fetch(
                `/api/method/solua_home.api.color_card.get_public_color_card?query=${encodeURIComponent(query)}`,
                { headers: { Accept: "application/json" } }
            );
            const payload = await response.json();
            if (!response.ok || !payload.message) {
                status.textContent = "Não encontrámos uma cartela publicada com essa referência.";
                return;
            }
            status.textContent = "";
            render(payload.message);
        } catch (error) {
            status.textContent = "Não foi possível pesquisar agora. Tenta novamente.";
        }
    };

    form.addEventListener("submit", (event) => {
        event.preventDefault();
        search(input.value);
    });

    const initial = new URLSearchParams(window.location.search).get("q");
    if (initial) {
        input.value = initial;
        search(initial);
    }
});
</script>
{% endblock %}
