<!doctype html>
<html lang="pt-MZ">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cartela de cores | SOLUA HOME</title>
  <meta name="description" content="Pesquisa uma referência SOLUA HOME e vê a cartela de cores da coleção.">
  <link rel="canonical" href="https://home.solua.one/colors">
  <link rel="icon" href="/files/solua-logo.jpg">
  <link rel="stylesheet" href="/assets/solua_home/css/storefront.css">
  <script defer src="/assets/solua_home/js/storefront.js"></script>
</head>
<body>
  <a class="skip-link" href="#conteudo">Saltar para o conteúdo</a>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="/" aria-label="SOLUA HOME, início"><img src="/files/solua-logo.jpg" alt=""></a>
      <nav aria-label="Navegação principal">
        <a href="/#colecoes">Cortinas</a>
        <a href="/#guia">Como escolher</a>
        <a href="/colors" aria-current="page">Cartela de cores</a>
      </nav>
    </div>
  </header>

  <main id="conteudo" class="wrap section color-page">
    <a class="text-link back-link" href="/#colecoes"><span aria-hidden="true">←</span> Todas as coleções</a>
    <h1>Cartela de cores</h1>
    <form class="search" id="color-search" action="/colors" method="get" role="search">
      <label for="q">Referência, código completo ou código de barras</label>
      <div class="search-row">
        <input type="search" id="q" name="q" placeholder="Ex.: SH151114" maxlength="80" required autocomplete="off" spellcheck="false">
        <button class="button" type="submit">Pesquisar</button>
      </div>
    </form>
    <p id="color-status" class="status" role="status"></p>
    <div id="color-result"></div>
    <p id="color-browse" class="browse-link"><a class="text-link" href="/#colecoes">Explorar todas as coleções <span aria-hidden="true">↗</span></a></p>
    <noscript><p>Activa o JavaScript para consultares as cartelas.</p></noscript>
  </main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <p>© 2026 SOLUA HOME</p>
      <a href="/">Voltar ao início</a>
    </div>
  </footer>
</body>
</html>
